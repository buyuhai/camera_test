[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hough-circle-gui"
version = "0.1.0"
description = "交互式霍夫圆检测 GUI（PyQt5 + OpenCV）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.6",
    "PyQt5>=5.15",
]

[project.scripts]
hough-gui = "hough_gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
